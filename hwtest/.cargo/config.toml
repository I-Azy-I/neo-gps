[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# probe-rs flashes the test binary and speaks the embedded-test protocol over
# the S3's built-in USB-Serial-JTAG, so no external debug probe is needed.
runner = "probe-rs run --chip esp32s3"
rustflags = ["-C", "force-frame-pointers"]

# The esp toolchain ships no prebuilt `core` for Xtensa targets; build it.
[unstable]
build-std = ["core", "alloc"]

[env]
ESP_LOG = "info"
